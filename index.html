<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV</title>
    <!-- Подключение шрифта Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Подключение внешних стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="container">
            <nav class="nav">
                <ul class="nav-list">
                    <li class="nav-item"><a href="#profile" class="nav-link">Profile</a></li>
                    <li class="nav-item"><a href="#contacts" class="nav-link">Contacts</a></li>
                    <li class="nav-item"><a href="#skills" class="nav-link">Skills</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content main-container">
        <section class="section" id="profile">
            <h1 class="section-title">John Doe</h1>
            <img src="./assets/img/avatar.jpg" alt="avatar" class="avatar">
            <p>Junior Frontend Developer. High motivation to learn new technologies.</p>
        </section>

        <section class="section" id="contacts">
            <h2 class="section-title">Contacts</h2>
            <p>Email: example@email.com</p>
            <p>GitHub: <a href="https://github.com">://github.com</a></p>
        </section>

        <section class="section" id="skills">
            <h2 class="section-title">Skills</h2>
            <ul>
                <li>HTML5 / CSS3</li>
                <li>JavaScript</li>
                <li>Git / GitHub</li>
            </ul>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2026 Personal CV</p>
        </div>
    </footer>

</body>
</html>
